<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Astris Productions</title>
<meta name="description" content="Astris Productions: films and photography by Josh.">
<meta name="theme-color" content="#0b0a09">
<meta property="og:title" content="Astris Productions">
<meta property="og:description" content="Films and photography by Josh.">
<meta property="og:image" content="/assets/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@200;300;400;500;600;700&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body data-page="">
<a class="skip-link" href="#page">Skip to content</a>

<div id="reel" aria-hidden="true">
  <video id="rv" muted loop playsinline autoplay preload="auto"></video>
  <div class="slides" id="slides"></div>
  <div id="scrim"></div>
</div>

<header id="rail">
  <a class="logo-link" href="#/" aria-label="Astris, home">
    <svg class="logo" viewBox="0 0 1900 1600" aria-hidden="true"><path class="logo-path" fill="currentColor" fill-rule="evenodd" d=""/></svg><b class="a">ASTRIS</b>
  </a>
  <nav id="nav" aria-label="Main"></nav>
</header>

<button id="burger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="menu"><i></i><i></i><i></i></button>

<div id="menu" role="dialog" aria-modal="true" aria-label="Menu">
  <div class="menu-top">
    <a class="logo-link menu-logo" href="#/" aria-label="Astris, home">
      <svg class="logo" viewBox="0 0 1900 1600" aria-hidden="true"><path class="logo-path" fill="currentColor" fill-rule="evenodd" d=""/></svg><b class="a">ASTRIS</b>
    </a>
    <button class="menu-x" type="button" aria-label="Close menu">&#10005;</button>
  </div>
  <div class="menu-body">
    <nav id="menu-nav" aria-label="Menu"></nav>
    <div class="menu-info" id="menu-info"></div>
  </div>
  <div class="menu-reel" id="menu-reel" aria-hidden="true"></div>
</div>

<main id="page" class="page" tabindex="-1"></main>
<div id="fx" aria-hidden="true"></div>
<div id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="sr" class="sr" aria-live="polite"></div>
<div id="grain" aria-hidden="true"></div>
<div id="grain2" aria-hidden="true"></div>
<div id="boot" aria-hidden="true"></div>

<noscript><p style="position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:#0b0a09;color:#f2ebdd;font:16px system-ui;padding:24px;text-align:center">Astris Productions needs JavaScript to show the films and photos. Email astris.a.productions@gmail.com or find Astris Productions on YouTube.</p></noscript>

<script src="/assets/brand.js"></script>
<script src="/assets/transitions.js"></script>
<script src="/assets/intro.js"></script>
<script src="/assets/data.js"></script>
<script>Array.prototype.forEach.call(document.querySelectorAll(".logo-path"), function (p) { p.setAttribute("d", window.ASTRIS_BRAND.logo); });</script>
<script src="/app.js"></script>
</body>
</html>
