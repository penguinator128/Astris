<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div class="blueprint" style="width:100%;aspect-ratio:{{ ratioVal }};background:{{ stripeBg }};position:relative">
  <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
  <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px;text-align:center">
    <span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;letter-spacing:0.04em;color:var(--color-accent-800);text-transform:uppercase;background:color-mix(in srgb, var(--color-bg) 72%, transparent);padding:4px 9px">{{ label }}</span>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:220},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;FILM STILL — 16:9&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ratio&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;16 / 9&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;accent&quot;,&quot;options&quot;:[&quot;accent&quot;,&quot;neutral&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const label = this.props.label ?? "MEDIA PLACEHOLDER";
    const ratioVal = this.props.ratio ?? "16 / 9";
    const tone = this.props.tone ?? "accent";
    const c1 = tone === "neutral" ? "var(--color-neutral-100)" : "var(--color-accent-100)";
    const c2 = tone === "neutral" ? "var(--color-neutral-200)" : "var(--color-accent-200)";
    const stripeBg = "repeating-linear-gradient(135deg, " + c1 + " 0px, " + c1 + " 12px, " + c2 + " 12px, " + c2 + " 24px)";
    return { label, ratioVal, stripeBg };
  }
}
</script>
</body>
</html>
