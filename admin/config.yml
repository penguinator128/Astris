backend:
  name: github
  repo: penguinator128/Astris
  branch: main
  base_url: https://astris1.vercel.app

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "photos"
    label: "Photos"
    label_singular: "Photo"
    folder: "content/photos"
    create: true
    sortable_fields: ["date", "title"]
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Photo", name: "image", widget: "image"}
      - {label: "Caption", name: "caption", widget: "string", required: false}
      - {label: "Description", name: "description", widget: "text", required: false}
      - {label: "Story", name: "story", widget: "text", required: false, hint: "The longer story behind the shot — shown on the photo page."}
      - label: "Series"
        name: "series"
        widget: "relation"
        collection: "series"
        search_fields: ["title"]
        value_field: "title"
        display_fields: ["title"]
        multiple: true
        required: false
      - {label: "Tags", name: "tags", widget: "list", required: false, hint: "Unlimited, free-form tags."}
      - {label: "Date Taken", name: "date", widget: "datetime"}
      - {label: "Camera", name: "camera", widget: "string", required: false}
      - {label: "Lens", name: "lens", widget: "string", required: false}
      - {label: "ISO", name: "iso", widget: "string", required: false}
      - {label: "Aperture", name: "aperture", widget: "string", required: false, hint: "e.g. f/2.8"}
      - {label: "Shutter Speed", name: "shutter_speed", widget: "string", required: false, hint: "e.g. 1/250s"}
      - {label: "Focal Length", name: "focal_length", widget: "string", required: false, hint: "e.g. 35mm"}
      - {label: "Featured (hero banner)", name: "featured", widget: "boolean", default: false, required: false}
      - {label: "Banner Order", name: "featured_order", widget: "number", required: false, value_type: "int"}
      - {label: "Allow Download", name: "download", widget: "boolean", default: false, required: false}

  - name: "series"
    label: "Series"
    label_singular: "Series"
    folder: "content/series"
    create: true
    identifier_field: "title"
    sortable_fields: ["order", "title"]
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Order", name: "order", widget: "number", required: false, value_type: "int"}
      - {label: "Description", name: "description", widget: "text", required: false}

  - name: "videos"
    label: "Films"
    label_singular: "Film"
    folder: "content/videos"
    create: true
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Film Type", name: "type", widget: "select", required: false, options:
          ["Documentary", "Narrative", "Commercial", "Short Film", "Travel", "Experimental", "Behind the Scenes", "Music Video", "Other"]}
      - {label: "Year", name: "year", widget: "string", required: false}
      - {label: "YouTube / Vimeo URL", name: "video_url", widget: "string", required: false, hint: "Preferred over uploading a file."}
      - {label: "Video File (optional)", name: "video", widget: "file", required: false}
      - {label: "Thumbnail", name: "thumbnail", widget: "image", required: false}
      - {label: "Length", name: "length", widget: "string", required: false, hint: "e.g. 4 min 10s"}
      - {label: "Date Made", name: "date", widget: "datetime"}
      - {label: "Description", name: "description", widget: "text", required: false}
      - {label: "Featured (hero banner)", name: "featured", widget: "boolean", default: false, required: false}
      - {label: "Banner Order", name: "featured_order", widget: "number", required: false, value_type: "int"}

  - name: "news"
    label: "News"
    label_singular: "News post"
    folder: "content/news"
    create: true
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Summary", name: "summary", widget: "text", required: false}
      - {label: "Image", name: "image", widget: "image", required: false}
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "settings"
    label: "Site Settings"
    editor:
      preview: false
    files:
      - label: "Website Text, Hero & Homepage"
        name: "site"
        file: "content/settings/site.yml"
        fields:
          - {label: "Brand name", name: "brand", widget: "string", default: "ASTRIS"}
          - {label: "Tagline", name: "tagline", widget: "string", required: false}
          - {label: "Hero title", name: "hero_title", widget: "string", default: "Astris"}
          - {label: "Hero subtitle", name: "hero_subtitle", widget: "string", required: false}
          - {label: "Hero background source", name: "hero_background", widget: "select", default: "photos", options: ["photos", "videos", "both"]}
          - {label: "Hero showreel video", name: "hero_video", widget: "file", required: false}
          - {label: "Hero button label", name: "hero_cta_label", widget: "string", default: "View Project"}
          - {label: "Hero button destination", name: "hero_cta_destination", widget: "select", default: "auto", options: ["auto", "photography", "films", "news", "about", "contact"]}
          - {label: "Hero auto-rotation", name: "hero_autoplay", widget: "boolean", default: true}
          - {label: "Hero interval (seconds)", name: "hero_interval", widget: "number", default: 6, value_type: "int"}

          - {label: "Latest photos: visible", name: "home_photos_enabled", widget: "boolean", default: true}
          - {label: "Latest photos: order", name: "home_photos_order", widget: "number", default: 1, value_type: "int"}
          - {label: "Latest photos: kicker", name: "home_latest_photos_kicker", widget: "string", default: "Stills"}
          - {label: "Latest photos: heading", name: "home_latest_photos_heading", widget: "string", default: "Latest photos"}
          - {label: "Latest photos: link label", name: "home_latest_photos_link", widget: "string", default: "View gallery"}

          - {label: "Latest films: visible", name: "home_films_enabled", widget: "boolean", default: true}
          - {label: "Latest films: order", name: "home_films_order", widget: "number", default: 2, value_type: "int"}
          - {label: "Latest films: kicker", name: "home_latest_films_kicker", widget: "string", default: "Motion"}
          - {label: "Latest films: heading", name: "home_latest_films_heading", widget: "string", default: "Latest films"}
          - {label: "Latest films: link label", name: "home_latest_films_link", widget: "string", default: "All films"}

          - {label: "Selected work: visible", name: "home_selected_enabled", widget: "boolean", default: true}
          - {label: "Selected work: order", name: "home_selected_order", widget: "number", default: 3, value_type: "int"}
          - {label: "Selected work: kicker", name: "home_selected_kicker", widget: "string", default: "Curated"}
          - {label: "Selected work: heading", name: "home_selected_heading", widget: "string", default: "Selected work"}
          - {label: "Selected work: intro", name: "home_selected_intro", widget: "text", required: false}

          - {label: "About preview: visible", name: "home_about_enabled", widget: "boolean", default: true}
          - {label: "About preview: order", name: "home_about_order", widget: "number", default: 4, value_type: "int"}

          - {label: "News preview: visible", name: "home_news_enabled", widget: "boolean", default: true}
          - {label: "News preview: order", name: "home_news_order", widget: "number", default: 5, value_type: "int"}
          - {label: "News preview: kicker", name: "home_news_kicker", widget: "string", default: "Journal"}
          - {label: "News preview: heading", name: "home_news_heading", widget: "string", default: "Latest news"}
          - {label: "News preview: link label", name: "home_news_link", widget: "string", default: "All news"}

          - {label: "Photography kicker", name: "photography_kicker", widget: "string", default: "Photography"}
          - {label: "Photography heading", name: "photography_heading", widget: "string", default: "The gallery"}
          - {label: "Photography intro", name: "photography_intro", widget: "text", required: false}
          - {label: "Films kicker", name: "films_kicker", widget: "string", default: "Filmography"}
          - {label: "Films heading", name: "films_heading", widget: "string", default: "Films"}
          - {label: "Films intro", name: "films_intro", widget: "text", required: false}
          - {label: "Downloads kicker", name: "downloads_kicker", widget: "string", default: "Free to use"}
          - {label: "Downloads heading", name: "downloads_heading", widget: "string", default: "Downloads"}
          - {label: "Downloads intro", name: "downloads_intro", widget: "text", required: false}
          - {label: "News kicker", name: "news_kicker", widget: "string", default: "Journal"}
          - {label: "News heading", name: "news_heading", widget: "string", default: "News"}
          - {label: "News intro", name: "news_intro", widget: "text", required: false}

          - {label: "Nav: Home", name: "nav_home", widget: "string", default: "Home"}
          - {label: "Nav: Films", name: "nav_films", widget: "string", default: "Films"}
          - {label: "Nav: Photography", name: "nav_photography", widget: "string", default: "Photography"}
          - {label: "Nav: Downloads", name: "nav_downloads", widget: "string", default: "Downloads"}
          - {label: "Nav: News", name: "nav_news", widget: "string", default: "News"}
          - {label: "Nav: About", name: "nav_about", widget: "string", default: "About"}
          - {label: "Nav: Contact", name: "nav_contact", widget: "string", default: "Contact"}

          - {label: "Footer text", name: "footer_text", widget: "string", required: false}
          - {label: "Footer note", name: "footer_note", widget: "string", required: false}

      - label: "About Page"
        name: "about"
        file: "content/settings/about.yml"
        fields:
          - {label: "Kicker", name: "kicker", widget: "string", default: "About"}
          - {label: "Heading", name: "heading", widget: "string"}
          - {label: "Intro", name: "intro", widget: "text", required: false}
          - {label: "Profile image", name: "image", widget: "image", required: false}
          - {label: "Biography", name: "body", widget: "markdown", required: false}
          - {label: "Button label", name: "button_label", widget: "string", default: "Get in touch"}
          - {label: "Button destination", name: "button_url", widget: "string", default: "#/contact"}
          - {label: "Homepage heading", name: "home_heading", widget: "string", required: false}
          - {label: "Homepage text", name: "home_text", widget: "text", required: false}
          - {label: "Capabilities", name: "capabilities", widget: "list", required: false}
          - label: "Extra links"
            name: "links"
            widget: "list"
            required: false
            fields:
              - {label: "Label", name: "label", widget: "string"}
              - {label: "URL", name: "url", widget: "string", required: false}

      - label: "Contact Page"
        name: "contact"
        file: "content/settings/contact.yml"
        fields:
          - {label: "Kicker", name: "kicker", widget: "string", default: "Contact"}
          - {label: "Heading", name: "heading", widget: "string"}
          - {label: "Intro", name: "intro", widget: "text", required: false}
          - {label: "Work email", name: "email", widget: "string"}
          - {label: "Email note", name: "email_note", widget: "string", required: false}
          - {label: "Based in", name: "location", widget: "string", required: false}
          - {label: "Availability", name: "availability", widget: "string", required: false}
          - label: "Social links"
            name: "socials"
            widget: "list"
            required: false
            fields:
              - {label: "Label", name: "label", widget: "string"}
              - {label: "URL", name: "url", widget: "string", required: false}
