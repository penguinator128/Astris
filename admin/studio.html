<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astris Studio — Admin</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e8c547' stroke-width='1.5'%3E%3Ccircle cx='12' cy='12' r='9'/%3E%3Cpath d='M12 3v4M12 17v4M3 12h4M17 12h4'/%3E%3C/svg%3E">
<style>
:root {
  --bg:#0c0c0d; --bg2:#121214; --panel:#17171a; --panel2:#1e1e22;
  --text:#f2efe6; --dim:rgba(242,239,230,.6); --faint:rgba(242,239,230,.35);
  --accent:#e8c547; --accent-text:#14120a; --line:rgba(242,239,230,.1); --line2:rgba(242,239,230,.2);
  --ok:#7fce74; --err:#e46a5c;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 "Barlow", system-ui, sans-serif; }
h1,h2,h3 { font-family:"Barlow Condensed", system-ui, sans-serif; text-transform:uppercase; letter-spacing:.03em; margin:0; }
button { font-family:inherit; cursor:pointer; }
input, select, textarea { font-family:inherit; font-size:13px; background:var(--bg2); color:var(--text); border:1px solid var(--line2); border-radius:4px; padding:7px 9px; }
input:focus, select:focus, textarea:focus { outline:1px solid var(--accent); }
input[type=checkbox] { accent-color:var(--accent); width:15px; height:15px; }
a { color:var(--accent); text-decoration:none; }

.layout { display:flex; min-height:100vh; }
.side { width:220px; flex:none; border-right:1px solid var(--line); padding:20px 14px; display:flex; flex-direction:column; gap:4px; position:sticky; top:0; height:100vh; }
.side .brand { display:flex; align-items:center; gap:9px; font-family:"Barlow Condensed"; font-weight:600; letter-spacing:.2em; font-size:16px; padding:6px 10px 22px; color:var(--text); }
.side .brand svg { color:var(--accent); }
.tab { display:flex; align-items:center; gap:10px; padding:10px 12px; border:none; background:none; color:var(--dim); font-size:14px; letter-spacing:.04em; border-radius:6px; text-align:left; transition:all .2s; }
.tab:hover { color:var(--text); background:var(--panel); }
.tab.active { background:var(--accent); color:var(--accent-text); font-weight:600; }
.side .foot { margin-top:auto; display:flex; flex-direction:column; gap:8px; font-size:12.5px; color:var(--faint); padding:10px; }
.main { flex:1; padding:28px 32px 80px; min-width:0; }
.pagehead { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:24px; flex-wrap:wrap; }
.pagehead h1 { font-size:30px; }
.pagehead .sub { color:var(--dim); margin-top:4px; font-size:13.5px; }

.btn { display:inline-flex; align-items:center; gap:8px; border:none; border-radius:5px; padding:10px 18px; font-family:"Barlow Condensed"; font-size:14px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; transition:all .2s; }
.btn-primary { background:var(--accent); color:var(--accent-text); }
.btn-primary:hover { transform:translateY(-1px); box-shadow:0 6px 18px rgba(232,197,71,.25); }
.btn-primary:disabled { opacity:.45; transform:none; box-shadow:none; cursor:default; }
.btn-ghost { background:transparent; color:var(--text); border:1px solid var(--line2); }
.btn-ghost:hover { border-color:var(--accent); color:var(--accent); }
.btn-danger { background:transparent; color:var(--err); border:1px solid var(--err); }
.btn-sm { padding:6px 12px; font-size:12.5px; }
.iconbtn { background:none; border:1px solid var(--line2); color:var(--dim); border-radius:4px; width:28px; height:28px; display:inline-flex; align-items:center; justify-content:center; font-size:13px; }
.iconbtn:hover { color:var(--accent); border-color:var(--accent); }

.cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px; margin-bottom:30px; }
.stat { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:18px; }
.stat .n { font-family:"Barlow Condensed"; font-size:34px; font-weight:600; color:var(--accent); }
.stat .l { font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--faint); }

.panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:20px; margin-bottom:20px; }
.panel h2 { font-size:19px; margin-bottom:14px; }

table.grid { width:100%; border-collapse:collapse; font-size:13px; }
table.grid th { text-align:left; font-family:"Barlow Condensed"; font-size:11.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--faint); padding:8px 10px; border-bottom:1px solid var(--line2); white-space:nowrap; }
table.grid td { padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
table.grid tr:hover td { background:rgba(255,255,255,.015); }
.thumb { width:64px; height:48px; object-fit:cover; border-radius:4px; background:var(--bg2); display:block; }
.pill { display:inline-block; font-size:11px; letter-spacing:.08em; padding:2px 9px; border-radius:999px; border:1px solid var(--line2); color:var(--dim); margin:1px 2px 1px 0; }

.toggle { position:relative; width:36px; height:20px; border-radius:999px; background:var(--bg2); border:1px solid var(--line2); transition:background .2s; flex:none; }
.toggle::after { content:""; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:var(--faint); transition:all .2s; }
.toggle.on { background:var(--accent); border-color:var(--accent); }
.toggle.on::after { left:18px; background:var(--accent-text); }

.batch-row { background:var(--panel); border:1px solid var(--line); border-radius:8px; margin-bottom:14px; overflow:hidden; }
.batch-head { display:flex; align-items:center; gap:14px; padding:12px 16px; cursor:pointer; }
.batch-head img { width:84px; height:60px; object-fit:cover; border-radius:4px; }
.batch-head .fn { font-size:12px; color:var(--faint); }
.batch-body { padding:0 16px 16px; display:grid; grid-template-columns:repeat(4,1fr); gap:10px; border-top:1px solid var(--line); padding-top:14px; }
.batch-body.hidden { display:none; }
.field { display:flex; flex-direction:column; gap:4px; }
.field label { font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); }
.field.wide { grid-column:span 2; }
.field.full { grid-column:1/-1; }
.row-flags { display:flex; align-items:center; gap:18px; grid-column:1/-1; padding-top:4px; flex-wrap:wrap; }
.flag { display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--dim); cursor:pointer; }

.drop { border:2px dashed var(--line2); border-radius:10px; padding:44px; text-align:center; color:var(--dim); transition:all .2s; cursor:pointer; }
.drop.over, .drop:hover { border-color:var(--accent); color:var(--accent); background:rgba(232,197,71,.04); }

.toast { position:fixed; bottom:22px; right:22px; background:var(--panel2); border:1px solid var(--line2); border-left:3px solid var(--accent); border-radius:6px; padding:13px 18px; max-width:420px; font-size:13.5px; box-shadow:0 12px 30px rgba(0,0,0,.5); z-index:200; animation:slideup .3s ease; }
.toast.err { border-left-color:var(--err); }
.toast.ok { border-left-color:var(--ok); }
@keyframes slideup { from { opacity:0; transform:translateY(12px); } }

.overlay { position:fixed; inset:0; background:rgba(5,5,6,.8); z-index:150; display:flex; align-items:center; justify-content:center; }
.overlay .box { background:var(--panel); border:1px solid var(--line2); border-radius:10px; padding:28px; width:min(460px,92vw); }
.progress { height:6px; border-radius:3px; background:var(--bg2); overflow:hidden; margin-top:14px; }
.progress i { display:block; height:100%; background:var(--accent); transition:width .3s; }

.setup { max-width:620px; margin:8vh auto; padding:0 20px; }
.setup ol { color:var(--dim); line-height:1.9; padding-left:20px; }
.setup code { background:var(--panel2); padding:2px 7px; border-radius:4px; font-size:12.5px; color:var(--accent); }
.bulkbar { position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--panel2); border:1px solid var(--line2); border-radius:8px; padding:10px 14px; margin-bottom:16px; }
.muted { color:var(--faint); font-size:12.5px; }
@media (max-width:900px) {
  .layout { flex-direction:column; }
  .side { width:100%; height:auto; position:static; flex-direction:row; flex-wrap:wrap; align-items:center; }
  .side .brand { padding-bottom:6px; } .side .foot { display:none; }
  .batch-body { grid-template-columns:1fr 1fr; }
  .main { padding:18px 14px 60px; }
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<script>
(() => {
"use strict";
const REPO = "penguinator128/Astris";
const BRANCH = "main";
const API = "https://api.github.com";
const TOKEN_KEY = "astris_studio_token";

const S = {
  token: localStorage.getItem(TOKEN_KEY) || "",
  view: "dashboard",
  photos: [], series: [], films: 0, news: 0,
  site: {}, sitePath: "content/settings/site.yml",
  imagePaths: new Set(), photoSlugs: new Set(),
  batch: [], sel: new Set(), dirty: new Set(),
  loaded: false, user: null
};

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

/* ---------------- GitHub API ---------------- */
async function gh(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: {
      "Authorization": "Bearer " + S.token,
      "Accept": opts.raw ? "application/vnd.github.raw+json" : "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28",
      ...(opts.body ? { "Content-Type": "application/json" } : {}),
      ...(opts.headers || {})
    }
  });
  if (!res.ok) {
    const t = await res.text().catch(() => "");
    throw new Error(`GitHub ${res.status}: ${t.slice(0, 200)}`);
  }
  return opts.raw ? res.text() : res.json();
}

/* Commit a set of file changes as one commit (chunked if images make it huge).
   changes: [{path, content?|base64?, del?}] */
async function commitFiles(message, changes, onProgress) {
  const chunks = [];
  let cur = [], curSize = 0;
  for (const ch of changes) {
    const size = ch.base64 ? ch.base64.length : (ch.content || "").length;
    if (cur.length && curSize + size > 36 * 1024 * 1024) { chunks.push(cur); cur = []; curSize = 0; }
    cur.push(ch); curSize += size;
  }
  if (cur.length) chunks.push(cur);

  for (let ci = 0; ci < chunks.length; ci++) {
    const chunk = chunks[ci];
    const suffix = chunks.length > 1 ? ` (${ci + 1}/${chunks.length})` : "";
    const ref = await gh(`/repos/${REPO}/git/ref/heads/${BRANCH}`);
    const headSha = ref.object.sha;
    const headCommit = await gh(`/repos/${REPO}/git/commits/${headSha}`);
    const treeEntries = [];
    let done = 0;
    for (const ch of chunk) {
      if (ch.del) {
        treeEntries.push({ path: ch.path, mode: "100644", type: "blob", sha: null });
      } else {
        const blob = await gh(`/repos/${REPO}/git/blobs`, {
          method: "POST",
          body: JSON.stringify(ch.base64
            ? { content: ch.base64, encoding: "base64" }
            : { content: ch.content, encoding: "utf-8" })
        });
        treeEntries.push({ path: ch.path, mode: "100644", type: "blob", sha: blob.sha });
      }
      done++;
      if (onProgress) onProgress(ci, chunks.length, done, chunk.length);
    }
    const tree = await gh(`/repos/${REPO}/git/trees`, {
      method: "POST", body: JSON.stringify({ base_tree: headCommit.tree.sha, tree: treeEntries })
    });
    const commit = await gh(`/repos/${REPO}/git/commits`, {
      method: "POST", body: JSON.stringify({ message: message + suffix, tree: tree.sha, parents: [headSha] })
    });
    await gh(`/repos/${REPO}/git/refs/heads/${BRANCH}`, {
      method: "PATCH", body: JSON.stringify({ sha: commit.sha })
    });
  }
}

/* ---------------- YAML helpers (subset used by this site) ---------------- */
function parseYAML(src) {
  const out = {}; const lines = src.replace(/\r/g, "").split("\n"); let i = 0;
  const unq = v => {
    v = v.trim();
    if ((v.startsWith('"') && v.endsWith('"')) || (v.startsWith("'") && v.endsWith("'"))) return v.slice(1, -1).replace(/\\"/g, '"');
    if (v === "true") return true; if (v === "false") return false;
    if (v !== "" && /^-?\d+(\.\d+)?$/.test(v)) return Number(v);
    return v;
  };
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim() || line.trim().startsWith("#")) { i++; continue; }
    const m = line.match(/^([A-Za-z0-9_-]+):\s*(.*)$/);
    if (!m) { i++; continue; }
    const key = m[1]; let val = m[2];
    if (val === "") {
      const items = []; let j = i + 1;
      while (j < lines.length) {
        const l = lines[j];
        if (!l.trim()) { j++; continue; }
        const im = l.match(/^\s+-\s*(.*)$/);
        if (!im) break;
        const om = im[1].match(/^([A-Za-z0-9_-]+):\s*(.*)$/);
        if (om) {
          const obj = {}; obj[om[1]] = unq(om[2]);
          const bi = l.match(/^\s*/)[0].length; j++;
          while (j < lines.length) {
            const l2 = lines[j]; if (!l2.trim()) { j++; continue; }
            const km = l2.match(/^\s+([A-Za-z0-9_-]+):\s*(.*)$/);
            if (!km || l2.match(/^\s*/)[0].length <= bi || /^\s+-/.test(l2)) break;
            obj[km[1]] = unq(km[2]); j++;
          }
          items.push(obj);
        } else { items.push(unq(im[1])); j++; }
      }
      if (items.length) { out[key] = items; i = j; continue; }
      out[key] = ""; i++; continue;
    }
    if (/^[>|]/.test(val)) {
      const buf = []; let j = i + 1;
      while (j < lines.length) { const l = lines[j]; if (l.trim() && !/^\s/.test(l)) break; buf.push(l.replace(/^\s{2}/, "")); j++; }
      out[key] = buf.join(val.startsWith("|") ? "\n" : " ").trim(); i = j; continue;
    }
    if (val.startsWith("[") && val.endsWith("]")) { out[key] = val.slice(1, -1).split(",").map(unq).filter(x => x !== ""); i++; continue; }
    out[key] = unq(val); i++;
  }
  return out;
}
function parseFM(text) {
  const m = text.match(/^---\s*\n([\s\S]*?)\n---\s*\n?([\s\S]*)$/);
  const data = parseYAML(m ? m[1] : text);
  data.body = m ? (m[2] || "").trim() : "";
  return data;
}
function yq(v) {
  if (v === true || v === false) return String(v);
  if (typeof v === "number") return String(v);
  const s = String(v == null ? "" : v);
  if (s === "") return '""';
  if (/^[A-Za-z0-9][A-Za-z0-9 _./()&+'-]*$/.test(s) && !/^(true|false|null|~|yes|no)$/i.test(s) && !/^\d/.test(s)) return s;
  return '"' + s.replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"';
}
function listYAML(key, arr) {
  const a = (arr || []).filter(x => String(x).trim() !== "");
  if (!a.length) return `${key}: []\n`;
  return `${key}:\n` + a.map(x => `  - ${yq(x)}`).join("\n") + "\n";
}
function photoToMD(p) {
  return "---\n" +
    `title: ${yq(p.title)}\n` +
    `image: ${yq(p.image)}\n` +
    `caption: ${yq(p.caption)}\n` +
    `description: ${yq(p.description)}\n` +
    `story: ${yq(p.story)}\n` +
    listYAML("series", p.series) +
    listYAML("tags", p.tags) +
    `date: ${yq(p.date)}\n` +
    `camera: ${yq(p.camera)}\n` +
    `lens: ${yq(p.lens)}\n` +
    `iso: ${yq(p.iso)}\n` +
    `aperture: ${yq(p.aperture)}\n` +
    `shutter_speed: ${yq(p.shutter)}\n` +
    `focal_length: ${yq(p.focal)}\n` +
    `featured: ${p.featured === true}\n` +
    `featured_order: ${Number(p.featuredOrder) || 999}\n` +
    `download: ${p.download === true}\n` +
    "---\n";
}
function seriesToMD(s) {
  return `---\ntitle: ${yq(s.title)}\norder: ${Number(s.order) || 999}\ndescription: ${yq(s.description || "")}\n---\n`;
}
function siteToYAML(site) {
  return Object.entries(site).filter(([k]) => k !== "body").map(([k, v]) => `${k}: ${yq(v)}`).join("\n") + "\n";
}

/* ---------------- data load ---------------- */
async function loadAll() {
  S.user = await gh("/user");
  const tree = (await gh(`/repos/${REPO}/git/trees/${BRANCH}?recursive=1`)).tree || [];
  S.imagePaths = new Set(tree.filter(n => n.path.startsWith("images/uploads/")).map(n => n.path));
  const photoFiles = tree.filter(n => /^content\/photos\/.+\.md$/.test(n.path));
  const seriesFiles = tree.filter(n => /^content\/series\/.+\.md$/.test(n.path));
  S.films = tree.filter(n => /^content\/videos\/.+\.(md|yml)$/.test(n.path)).length;
  S.news = tree.filter(n => /^content\/news\/.+\.md$/.test(n.path)).length;

  const fetchRaw = p => gh(`/repos/${REPO}/contents/${encodeURIComponent(p).replace(/%2F/g, "/")}?ref=${BRANCH}`, { raw: true });
  S.photos = (await Promise.all(photoFiles.map(async n => {
    const d = parseFM(await fetchRaw(n.path));
    return {
      path: n.path, slug: n.path.split("/").pop().replace(/\.md$/, ""),
      title: d.title || "", image: d.image || "", caption: d.caption || "",
      description: d.description || "", story: d.story || "",
      series: Array.isArray(d.series) ? d.series : (d.series ? [d.series] : (d.project ? [d.project] : [])),
      tags: Array.isArray(d.tags) ? d.tags : (d.tags ? [d.tags] : []),
      date: d.date || "", camera: d.camera || "", lens: d.lens || "", iso: String(d.iso || ""),
      aperture: d.aperture || "", shutter: d.shutter_speed || "", focal: d.focal_length || "",
      featured: d.featured === true, featuredOrder: Number(d.featured_order) || 999,
      download: d.download === true || d.downloadable === true
    };
  }))).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  S.photoSlugs = new Set(S.photos.map(p => p.slug));

  S.series = (await Promise.all(seriesFiles.map(async n => {
    const d = parseFM(await fetchRaw(n.path));
    return { path: n.path, title: d.title || "", order: Number(d.order) || 999, description: d.description || "" };
  }))).sort((a, b) => a.order - b.order);

  try { S.site = parseYAML(await fetchRaw(S.sitePath)); } catch (e) { S.site = {}; }
  S.loaded = true;
}

/* ---------------- UI helpers ---------------- */
function toast(msg, kind) {
  const t = document.createElement("div");
  t.className = "toast " + (kind || "");
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 4500);
}
let overlayEl = null;
function showProgress(title) {
  overlayEl = document.createElement("div");
  overlayEl.className = "overlay";
  overlayEl.innerHTML = `<div class="box"><h2 style="font-size:20px">${esc(title)}</h2>
    <p class="muted" id="progText" style="margin:8px 0 0">Starting…</p>
    <div class="progress"><i id="progBar" style="width:2%"></i></div></div>`;
  document.body.appendChild(overlayEl);
}
function setProgress(frac, text) {
  if (!overlayEl) return;
  $("#progBar", overlayEl).style.width = Math.round(frac * 100) + "%";
  if (text) $("#progText", overlayEl).textContent = text;
}
function hideProgress() { if (overlayEl) { overlayEl.remove(); overlayEl = null; } }

function slugify(s) {
  return String(s).toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60) || "untitled";
}
function uniqueSlug(base, taken) {
  let s = base, n = 2;
  while (taken.has(s)) s = `${base}-${n++}`;
  taken.add(s);
  return s;
}
function splitCSV(v) { return String(v || "").split(",").map(x => x.trim()).filter(Boolean); }

/* ---------------- views ---------------- */
function render() {
  const root = $("#root");
  if (!S.token) { renderSetup(root); return; }
  if (!S.loaded) {
    root.innerHTML = `<div class="setup" style="text-align:center;padding-top:16vh">
      <h1 style="font-size:26px;letter-spacing:.2em">ASTRIS STUDIO</h1><p class="muted" style="margin-top:14px">Loading your library…</p></div>`;
    return;
  }
  root.innerHTML = `<div class="layout">
    <aside class="side">
      <span class="brand"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"></circle><path d="M12 3v4M12 17v4M3 12h4M17 12h4"></path></svg>STUDIO</span>
      ${[["dashboard","Dashboard"],["batch","Batch Upload"],["library","Photo Library"],["banner","Hero Banner"],["seriesMgr","Series"]].map(([id,label]) =>
        `<button class="tab ${S.view===id?"active":""}" data-view="${id}">${label}</button>`).join("")}
      <div class="foot">
        <a href="/admin/" target="_blank">Open CMS editor ↗</a>
        <a href="/" target="_blank">View website ↗</a>
        <span>${esc(S.user ? S.user.login : "")}</span>
        <a href="#" id="logout">Sign out</a>
      </div>
    </aside>
    <main class="main" id="view"></main>
  </div>`;
  $$(".tab", root).forEach(b => b.addEventListener("click", () => { S.view = b.dataset.view; render(); }));
  $("#logout").addEventListener("click", e => { e.preventDefault(); localStorage.removeItem(TOKEN_KEY); location.reload(); });
  const v = $("#view");
  ({ dashboard: renderDashboard, batch: renderBatch, library: renderLibrary, banner: renderBanner, seriesMgr: renderSeries })[S.view](v);

/* ---------- batch upload ---------- */
async function filesPicked(files) {
  const imgs = Array.from(files).filter(f => /^image\//.test(f.type));
  if (!imgs.length) return;
  for (const f of imgs) {
    const row = {
      file: f, url: URL.createObjectURL(f), collapsed: S.batch.length > 0,
      title: f.name.replace(/\.[^.]+$/, "").replace(/[-_]+/g, " ").trim(),
      caption: "", description: "", story: "", series: [], tags: [],
      date: "", camera: "", lens: "", iso: "", aperture: "", shutter: "", focal: "",
      featured: false, download: false
    };
    S.batch.push(row);
    try {
      const x = await exifr.parse(f, ["Make", "Model", "LensModel", "ISO", "FNumber", "ExposureTime", "FocalLength", "DateTimeOriginal", "CreateDate"]);
      if (x) {
        row.camera = [x.Make, x.Model].filter(Boolean).join(" ").replace(/^(\w+)\s+\1/i, "$1");
        row.lens = x.LensModel || "";
        row.iso = x.ISO ? String(x.ISO) : "";
        row.aperture = x.FNumber ? "f/" + x.FNumber : "";
        row.shutter = x.ExposureTime ? (x.ExposureTime < 1 ? "1/" + Math.round(1 / x.ExposureTime) + "s" : x.ExposureTime + "s") : "";
        row.focal = x.FocalLength ? Math.round(x.FocalLength) + "mm" : "";
        const d = x.DateTimeOriginal || x.CreateDate;
        if (d instanceof Date && !isNaN(d)) row.date = d.toISOString();
      }
    } catch (e) { /* EXIF is best-effort */ }
  }
  if (!S.batch.some(r => !r.date)) toast("EXIF metadata extracted for all photos", "ok");
  render();
}

function readBase64(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(String(fr.result).split(",")[1]);
    fr.onerror = rej;
    fr.readAsDataURL(file);
  });
}

async function publishBatch() {
  if (!S.batch.length) return;
  const totalMB = S.batch.reduce((a, r) => a + r.file.size, 0) / 1024 / 1024;
  if (totalMB > 300 && !confirm(`This batch is ${Math.round(totalMB)} MB — large batches can be slow. Continue?`)) return;
  showProgress("Publishing " + S.batch.length + " photos");
  try {
    const takenSlugs = new Set(S.photoSlugs);
    const takenImages = new Set(S.imagePaths);
    const changes = [];
    let maxOrder = Math.max(0, ...S.photos.filter(p => p.featured).map(p => p.featuredOrder).filter(n => n < 999));
    for (let i = 0; i < S.batch.length; i++) {
      const r = S.batch[i];
      setProgress(0.4 * (i / S.batch.length), `Preparing ${r.file.name}…`);
      const ext = (r.file.name.match(/\.[a-z0-9]+$/i) || [".jpg"])[0].toLowerCase();
      let imgBase = "images/uploads/" + slugify(r.file.name.replace(/\.[^.]+$/, "")) + ext;
      let n = 2;
      while (takenImages.has(imgBase)) imgBase = imgBase.replace(/(\.[a-z0-9]+)$/, "") .replace(/-\d+$/, "") + "-" + (n++) + ext;
      takenImages.add(imgBase);
      const slug = uniqueSlug(slugify(r.title || r.file.name), takenSlugs);
      const p = {
        title: r.title || slug, image: "/" + imgBase, caption: r.caption,
        description: r.description, story: r.story, series: r.series, tags: r.tags,
        date: r.date || new Date().toISOString(), camera: r.camera, lens: r.lens,
        iso: r.iso, aperture: r.aperture, shutter: r.shutter, focal: r.focal,
        featured: r.featured, featuredOrder: r.featured ? ++maxOrder : 999, download: r.download
      };
      changes.push({ path: imgBase, base64: await readBase64(r.file) });
      changes.push({ path: "content/photos/" + slug + ".md", content: photoToMD(p) });
    }
    await commitFiles(`Batch upload: ${S.batch.length} photos via Astris Studio`, changes,
      (ci, cn, done, total) => setProgress(0.4 + 0.6 * ((ci + done / total) / cn), `Uploading to GitHub… (${done}/${total})`));
    hideProgress();
    toast(`Published ${S.batch.length} photos ✓ — the site will update after the next deploy.`, "ok");
    S.batch = [];
    S.loaded = false; render(); await loadAll(); render();
  } catch (e) {
    hideProgress();
    toast("Publish failed: " + e.message, "err");
  }
}

  showProgress("Deleting " + list.length + " photo" + (list.length > 1 ? "s" : ""));
  try {
    const changes = [];
    for (const p of list) {
      changes.push({ path: p.path, del: true });
      // remove the image file too if no other photo uses it
      const img = (p.image || "").replace(/^\//, "");
      if (img && S.photos.filter(x => x !== p && x.image.replace(/^\//, "") === img).length === 0 && S.imagePaths.has(img))
        changes.push({ path: img, del: true });
    }
    await commitFiles(`Delete ${list.length} photos via Astris Studio`, changes);
    hideProgress();
    toast("Deleted ✓", "ok");
    S.sel = new Set(); S.loaded = false; render(); await loadAll(); render();
  } catch (e) { hideProgress(); toast("Delete failed: " + e.message, "err"); }
}

/* ---------- hero banner ---------- */
function renderBanner(v) {
  const feat = S.photos.filter(p => p.featured).sort((a, b) => a.featuredOrder - b.featuredOrder);
  v.innerHTML = `
    <div class="pagehead"><div><h1>Hero banner</h1>
      <div class="sub">The homepage banner shows the first 5 featured photos in this order.</div></div>
      <button class="btn btn-primary" id="saveBanner">Save banner</button></div>
    <div class="panel"><h2>Rotation</h2>
      <div style="display:flex;align-items:center;gap:22px;flex-wrap:wrap">
        <label class="flag"><span class="toggle ${S.site.hero_autoplay !== false ? "on" : ""}" id="autoT"></span>Auto-rotate</label>
        <label class="flag">Interval
          <input id="intervalI" type="number" min="3" max="20" value="${Number(S.site.hero_interval) || 6}" style="width:70px"> seconds</label>
      </div></div>
    <div class="panel"><h2>Order</h2>
      ${feat.length ? `<table class="grid"><tbody id="bannerRows">
        ${feat.map((p, i) => `<tr data-slug="${esc(p.slug)}">
          <td class="muted" style="width:30px">${i + 1}</td>
          <td><img class="thumb" src="${esc(p.image)}"></td>
          <td>${esc(p.title)} ${i < 5 ? '<span class="pill" style="color:var(--accent);border-color:var(--accent)">in banner</span>' : '<span class="pill">overflow</span>'}</td>
          <td style="white-space:nowrap;text-align:right">
            <button class="iconbtn" data-m="up" ${i === 0 ? "disabled" : ""}>↑</button>
            <button class="iconbtn" data-m="down" ${i === feat.length - 1 ? "disabled" : ""}>↓</button>
            <button class="iconbtn" data-m="out" title="Remove from banner">✕</button>
          </td></tr>`).join("")}
      </tbody></table>` : `<p class="muted">No featured photos yet — feature some in the Photo Library.</p>`}
    </div>`;
  const autoT = $("#autoT", v);
  autoT.addEventListener("click", () => autoT.classList.toggle("on"));
  $$("#bannerRows [data-m]", v).forEach(b => b.addEventListener("click", () => {
    const tr = b.closest("tr");
    const slug = tr.dataset.slug;
    const list = S.photos.filter(p => p.featured).sort((a, b2) => a.featuredOrder - b2.featuredOrder);
    const idx = list.findIndex(p => p.slug === slug);
    if (b.dataset.m === "up" && idx > 0) [list[idx - 1], list[idx]] = [list[idx], list[idx - 1]];
    if (b.dataset.m === "down" && idx < list.length - 1) [list[idx + 1], list[idx]] = [list[idx], list[idx + 1]];
    if (b.dataset.m === "out") { list[idx].featured = false; markDirtyBanner(list[idx]); list.splice(idx, 1); }
    list.forEach((p, i) => { if (p.featuredOrder !== i + 1) { p.featuredOrder = i + 1; markDirtyBanner(p); } });
    renderBanner(v);
  }));
  function markDirtyBanner(p) { S.dirty.add(p.slug); }
  $("#saveBanner", v).addEventListener("click", async () => {
    showProgress("Saving banner");
    try {
      const changes = S.photos.filter(p => S.dirty.has(p.slug)).map(p => ({ path: p.path, content: photoToMD(p) }));
      const newAuto = autoT.classList.contains("on");
      const newInt = Math.max(3, Number($("#intervalI", v).value) || 6);
      if (newAuto !== (S.site.hero_autoplay !== false) || newInt !== (Number(S.site.hero_interval) || 6)) {
        S.site.hero_autoplay = newAuto;
        S.site.hero_interval = newInt;
        changes.push({ path: S.sitePath, content: siteToYAML(S.site) });
      }
      if (!changes.length) { hideProgress(); toast("Nothing to save"); return; }
      await commitFiles("Update hero banner via Astris Studio", changes);
      S.dirty = new Set();
      hideProgress();
      toast("Banner saved ✓", "ok");
    } catch (e) { hideProgress(); toast("Save failed: " + e.message, "err"); }
  });
}

/* ---------- series manager ---------- */
function renderSeries(v) {
  const count = t => S.photos.filter(p => p.series.includes(t)).length;
  v.innerHTML = `
    <div class="pagehead"><div><h1>Series</h1>
      <div class="sub">Series group photos into browsable collections — shown as chips on the Photography page.</div></div></div>
    <div class="panel"><h2>New series</h2>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <input id="newSeries" placeholder="e.g. Wildlife" style="width:220px">
        <button class="btn btn-primary btn-sm" id="addSeries">Create</button>
      </div></div>
    <div class="panel" style="padding:0;overflow-x:auto">
      <table class="grid"><thead><tr><th style="width:30px"></th><th>Series</th><th>Photos</th><th></th></tr></thead><tbody>
      ${S.series.map((s, i) => `<tr data-i="${i}">
        <td class="muted">${i + 1}</td>
        <td><strong>${esc(s.title)}</strong></td>
        <td class="muted">${count(s.title)}</td>
        <td style="text-align:right;white-space:nowrap">
          <button class="iconbtn" data-m="up" ${i === 0 ? "disabled" : ""}>↑</button>
          <button class="iconbtn" data-m="down" ${i === S.series.length - 1 ? "disabled" : ""}>↓</button>
          <button class="btn btn-ghost btn-sm" data-m="rename">Rename</button>
          <button class="btn btn-ghost btn-sm" data-m="merge">Merge into…</button>
          <button class="btn btn-danger btn-sm" data-m="del">Delete</button>
        </td></tr>`).join("")}
      </tbody></table></div>
    <p class="muted">Renaming, merging or deleting a series also updates every photo that uses it.</p>`;

  $("#addSeries", v).addEventListener("click", async () => {
    const t = $("#newSeries", v).value.trim();
    if (!t) return;
    if (S.series.some(s => s.title.toLowerCase() === t.toLowerCase())) { toast("That series already exists", "err"); return; }
    await doSeriesOp("Create series: " + t, [{
      path: "content/series/" + slugify(t) + ".md",
      content: seriesToMD({ title: t, order: S.series.length + 1, description: "" })
    }]);
  });
  $$("tbody tr", v).forEach(tr => {
    const s = S.series[Number(tr.dataset.i)];
    $$("[data-m]", tr).forEach(b => b.addEventListener("click", async () => {
      const m = b.dataset.m;
      if (m === "up" || m === "down") {
        const i = S.series.indexOf(s);
        const j = m === "up" ? i - 1 : i + 1;
        [S.series[i], S.series[j]] = [S.series[j], S.series[i]];
        const changes = S.series.map((x, k) => { x.order = k + 1; return { path: x.path, content: seriesToMD(x) }; });
        await doSeriesOp("Reorder series", changes);
      }
      if (m === "rename") {
        const nt = prompt(`Rename series "${s.title}" to:`, s.title);
        if (!nt || nt === s.title) return;
        const changes = [{ path: s.path, del: true },
          { path: "content/series/" + slugify(nt) + ".md", content: seriesToMD({ ...s, title: nt }) }];
        S.photos.filter(p => p.series.includes(s.title)).forEach(p => {
          p.series = p.series.map(x => x === s.title ? nt : x);
          changes.push({ path: p.path, content: photoToMD(p) });
        });
        await doSeriesOp(`Rename series ${s.title} → ${nt}`, changes);
      }
      if (m === "merge") {
        const others = S.series.filter(x => x !== s).map(x => x.title);
        const target = prompt(`Merge "${s.title}" into which series?\nOptions: ${others.join(", ")}`);
        if (!target || !others.includes(target)) { if (target) toast("Unknown series: " + target, "err"); return; }
        const changes = [{ path: s.path, del: true }];
        S.photos.filter(p => p.series.includes(s.title)).forEach(p => {
          p.series = [...new Set(p.series.map(x => x === s.title ? target : x))];
          changes.push({ path: p.path, content: photoToMD(p) });
        });
        await doSeriesOp(`Merge series ${s.title} → ${target}`, changes);
      }
      if (m === "del") {
        const n = count(s.title);
        if (!confirm(`Delete series "${s.title}"?${n ? ` It will be removed from ${n} photo${n > 1 ? "s" : ""}.` : ""}`)) return;
        const changes = [{ path: s.path, del: true }];
        S.photos.filter(p => p.series.includes(s.title)).forEach(p => {
          p.series = p.series.filter(x => x !== s.title);
          changes.push({ path: p.path, content: photoToMD(p) });
        });
        await doSeriesOp("Delete series: " + s.title, changes);
      }
    }));
  });
  async function doSeriesOp(msg, changes) {
    showProgress(msg);
    try {
      await commitFiles(msg + " via Astris Studio", changes);
      hideProgress(); toast("Done ✓", "ok");
      S.loaded = false; render(); await loadAll(); render();
    } catch (e) { hideProgress(); toast("Failed: " + e.message, "err"); }
  }
}

/* ---------------- boot ---------------- */
async function boot() {
  render();
  if (!S.token) return;
  try {
    await loadAll();
    render();
  } catch (e) {
    toast("Couldn't load the library: " + e.message, "err");
    if (/401|403/.test(e.message)) { localStorage.removeItem(TOKEN_KEY); S.token = ""; render(); }
  }
}
boot();
})();
</script>
</body>
</html>
