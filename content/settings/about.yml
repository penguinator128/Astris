home_heading: "Hi, I'm Josh"
home_text: "Josh Brogan is a Canberra-based filmmaker who loves storytelling and cinematography. His work explores identity and self-expression, drawing on real voices and lived experience. As a member of the LGBTQIA+ community, he is drawn to stories that make space for people to be seen. Josh writes, directs, shoots, edits and composes his own work, and hopes to build a career in video production and cinematography."
